services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hls-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hls-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app  # Mapeia a sua pasta local (./frontend) para dentro do container (/app)
      - /app/node_modules # Impede que o volume local sobrescreva os pacotes do Linux
    environment:
      - VITE_HLS_URL=http://localhost:3000/stream/index.m3u8
    depends_on:
      - backend
    restart: unless-stopped
